<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mid-Exam Revision Portal — Java & Computer Organization</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #0a0a0a;
            --border: #0a0a0a;
            --muted: #525252;
            --surface: #fafafa;
            --code-bg: #f4f4f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            padding: 16px;
            max-width: 980px;
            margin: 0 auto;
        }

        header {
            border-bottom: 3px solid var(--border);
            padding: 12px 0 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.4px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13.5px;
            margin-top: 4px;
        }

        .status-pill {
            background: #000;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .controls {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 2px solid var(--border);
            border-radius: 4px;
            outline: none;
            background: #fff;
            color: #000;
        }

        .search-box input:focus {
            box-shadow: 0 0 0 2px #000;
        }

        .filter-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            min-width: 58px;
        }

        .filter-btn {
            background: #fff;
            color: #000;
            border: 1.5px solid var(--border);
            padding: 5px 11px;
            font-size: 12.5px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }

        .filter-btn.active {
            background: #000;
            color: #fff;
        }

        .filter-btn:hover:not(.active) {
            background: #e5e5e5;
        }

        .summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            font-weight: 700;
            margin-bottom: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #fff;
            color: #000;
            border: 1.5px solid #000;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }

        .action-btn:hover {
            background: #000;
            color: #fff;
        }

        .q-card {
            border: 2px solid var(--border);
            border-radius: 6px;
            margin-bottom: 12px;
            background: #fff;
            overflow: hidden;
        }

        .q-header {
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            background: #fff;
            user-select: none;
        }

        .q-header:hover {
            background: #f5f5f5;
        }

        .q-card.open .q-header {
            background: #efefef;
            border-bottom: 2px solid var(--border);
        }

        .badges {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 10.5px;
            font-weight: 800;
            padding: 2px 6px;
            border: 1px solid #000;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .badge.subj { background: #000; color: #fff; }
        .badge.unit { background: #fff; color: #000; }
        .badge.short { background: #e5e5e5; color: #000; }
        .badge.essay { background: #000; color: #fff; }

        .q-title {
            font-size: 15.5px;
            font-weight: 700;
            color: #000;
        }

        .toggle-icon {
            font-size: 18px;
            font-weight: 900;
            line-height: 1.2;
            flex-shrink: 0;
        }

        .q-body {
            padding: 14px;
            display: none;
            background: #fff;
            font-size: 14.5px;
        }

        .q-card.open .q-body {
            display: block;
        }

        .intuition-box {
            background: #fafafa;
            border: 1px solid #d4d4d8;
            border-left: 4px solid #000;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .intuition-box .title {
            font-weight: 800;
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
            display: block;
        }

        .section-block {
            margin-bottom: 12px;
        }

        .section-block:last-child {
            margin-bottom: 0;
        }

        .section-block h4 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
            border-bottom: 1px dashed #a1a1aa;
            padding-bottom: 3px;
        }

        .section-block ul, .section-block ol {
            padding-left: 20px;
            margin-bottom: 6px;
        }

        .section-block li {
            margin-bottom: 4px;
        }

        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            background: var(--code-bg);
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid #d4d4d8;
        }

        pre {
            background: var(--code-bg);
            border: 1.5px solid #000;
            padding: 10px 12px;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12.5px;
            overflow-x: auto;
            white-space: pre;
            line-height: 1.4;
            margin: 6px 0;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
            font-size: 13px;
        }

        th, td {
            border: 1.5px solid #000;
            padding: 6px 8px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #efefef;
            font-weight: 800;
        }

        footer {
            margin-top: 32px;
            padding: 16px 0;
            border-top: 2px solid #000;
            text-align: center;
            font-size: 12.5px;
            color: var(--muted);
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            h1 { font-size: 20px; }
            pre { font-size: 11.5px; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Mid-Exam Revision Portal</h1>
            <div class="subtitle">Zero-Knowledge Plain-English Answers • Java & Computer Organization (Units III–V)</div>
        </div>
        <div class="status-pill" id="liveUrl">LIGHT & BLACK EDITION</div>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search topic or question (e.g. 'TreeSet', 'AVL', 'deadlock', 'DMA', 'RISC', 'exception')..." />
        </div>

        <div class="filter-row">
            <span class="filter-label">Subject:</span>
            <button class="filter-btn active" data-filter="subject" data-val="ALL">All</button>
            <button class="filter-btn" data-filter="subject" data-val="JAVA">Java Programming</button>
            <button class="filter-btn" data-filter="subject" data-val="CO">Computer Organization (CO)</button>
        </div>

        <div class="filter-row">
            <span class="filter-label">Unit:</span>
            <button class="filter-btn active" data-filter="unit" data-val="ALL">All Units</button>
            <button class="filter-btn" data-filter="unit" data-val="UNIT-3">Unit III</button>
            <button class="filter-btn" data-filter="unit" data-val="UNIT-4">Unit IV</button>
            <button class="filter-btn" data-filter="unit" data-val="UNIT-5">Unit V</button>
        </div>

        <div class="filter-row">
            <span class="filter-label">Type:</span>
            <button class="filter-btn active" data-filter="type" data-val="ALL">All Types</button>
            <button class="filter-btn" data-filter="type" data-val="SHORT">Short Answers</button>
            <button class="filter-btn" data-filter="type" data-val="ESSAY">Long / Essay Answers</button>
        </div>
    </div>

    <div class="summary-bar">
        <span id="resultsCount">Loading...</span>
        <div>
            <button class="action-btn" onclick="toggleAll(true)">Expand All</button>
            <button class="action-btn" onclick="toggleAll(false)">Collapse All</button>
        </div>
    </div>

    <div id="questionsContainer"></div>

    <footer>
        Mid-Exam Master Notes • Clean Light & Black Theme • Complete Question Bank Coverage
    </footer>

    <script src="data.js"></script>
    <script>
        let filters = { subject: 'ALL', unit: 'ALL', type: 'ALL', search: '' };

        function render() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            const matches = QUESTIONS_DATA.filter(q => {
                if (filters.subject !== 'ALL' && q.subject !== filters.subject) return false;
                if (filters.unit !== 'ALL' && q.unit !== filters.unit) return false;
                if (filters.type !== 'ALL' && q.type !== filters.type) return false;
                if (filters.search) {
                    const text = (q.q + ' ' + q.plainEnglish + ' ' + q.examPoints + ' ' + (q.code || '')).toLowerCase();
                    if (!text.includes(filters.search.toLowerCase())) return false;
                }
                return true;
            });

            document.getElementById('resultsCount').innerText = `Showing ${matches.length} of ${QUESTIONS_DATA.length} questions`;

            if (matches.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:36px; font-weight:700; border:2px dashed #000; border-radius:6px;">No matching questions found. Try clearing your search or filters.</div>';
                return;
            }

            matches.forEach(item => {
                const card = document.createElement('div');
                card.className = 'q-card';
                card.id = 'card_' + item.id;

                const codeBlock = item.code ? `
                    <div class="section-block">
                        <h4>Code / Syntax</h4>
                        <pre>${escapeHtml(item.code)}</pre>
                    </div>` : '';

                const diagramBlock = item.diagram ? `
                    <div class="section-block">
                        <h4>Diagram / Visual</h4>
                        <pre>${escapeHtml(item.diagram)}</pre>
                    </div>` : '';

                card.innerHTML = `
                    <div class="q-header" onclick="toggleCard('${item.id}')">
                        <div>
                            <div class="badges">
                                <span class="badge subj">${item.subject}</span>
                                <span class="badge unit">${item.unit}</span>
                                <span class="badge ${item.type.toLowerCase()}">${item.type === 'SHORT' ? 'Short Answer' : 'Essay / Long'}</span>
                                <span style="font-size:11.5px; font-weight:700; color:#525252;">Q# ${item.qNum}</span>
                            </div>
                            <div class="q-title">${item.q}</div>
                        </div>
                        <div class="toggle-icon" id="icon_${item.id}">+</div>
                    </div>
                    <div class="q-body" id="body_${item.id}">
                        <div class="intuition-box">
                            <span class="title">In Plain English (From Scratch)</span>
                            ${item.plainEnglish}
                        </div>
                        <div class="section-block">
                            <h4>Points to Write in Exam</h4>
                            <div>${item.examPoints}</div>
                        </div>
                        ${diagramBlock}
                        ${codeBlock}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleCard(id) {
            const card = document.getElementById('card_' + id);
            const icon = document.getElementById('icon_' + id);
            card.classList.toggle('open');
            icon.innerText = card.classList.contains('open') ? '−' : '+';
        }

        function toggleAll(open) {
            document.querySelectorAll('.q-card').forEach(card => {
                card.classList.toggle('open', open);
                const icon = card.querySelector('.toggle-icon');
                if (icon) icon.innerText = open ? '−' : '+';
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        if (window.location.protocol.startsWith('http')) {
            document.getElementById('liveUrl').innerText = window.location.host;
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const group = e.target.getAttribute('data-filter');
                const val = e.target.getAttribute('data-val');
                document.querySelectorAll(`.filter-btn[data-filter="${group}"]`).forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                filters[group] = val;
                render();
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            filters.search = e.target.value.trim();
            render();
        });

        window.onload = render;
    </script>
</body>
</html>
